name: fixture-errors

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  compiler-errors:
    name: compiler errors match the recorded measurement
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "26"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: python3 tools/check_pr.py
        env:
          FIXTURE_REF: ${{ github.head_ref || github.ref_name }}
